name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - run: dotnet build Tervia.Portable.slnf -c Release
      - uses: github/codeql-action/analyze@v3

  analyze-winui:
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - run: dotnet build Tervia.sln -c Release -p:Platform=x64
      - uses: github/codeql-action/analyze@v3
