name: Feature request
description: Suggest a capability or platform improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: vendor
    attributes:
      label: Vendor documentation
      description: Link the official documentation that supports this capability.
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This request does not require bypassing vendor security
          required: true
        - label: This request is about physical televisions, not sticks or boxes
          required: true
